name: Frontend navigation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-and-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Build seven-screen preview index
        run: npm run preview:index
        working-directory: frontend
        env:
          PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Publish dashboard screenshot gallery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-previews-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/preview-screenshots/
          if-no-files-found: error
          retention-days: 30
      - name: Save synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-navigation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
