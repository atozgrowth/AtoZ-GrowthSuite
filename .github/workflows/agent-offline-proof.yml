name: Agent offline proof
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-proof:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test && npm run build
      - name: Run synthetic provider and tools without network credentials
        run: |
          node dist/agents/demo.js > offline-proof.json
          sha256sum offline-proof.json > offline-proof.sha256
          printf '%s\n' "$GITHUB_SHA" > source-revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-offline-proof-${{ github.run_id }}
          path: |
            backend/offline-proof.json
            backend/offline-proof.sha256
            backend/source-revision.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-offline-proof-${{ github.run_id }}
          path: backend/artifact-roundtrip
      - name: Verify downloaded synthetic artifact checksum and revision
        run: |
          cd artifact-roundtrip
          sha256sum --check offline-proof.sha256
          test "$(cat source-revision.txt)" = "$GITHUB_SHA"
          node -e "const f=JSON.parse(require('fs').readFileSync('offline-proof.json')); if (!f.synthetic || f.liveApiCalls!==0 || f.modelApiCalls!==0 || f.productionWritesEnabled!==false) process.exit(1)"
