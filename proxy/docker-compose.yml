services:
  caddy:
    image: caddy:2-alpine
    container_name: atoz_caddy
    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - atoz_net

volumes:
  caddy_data:
  caddy_config:

networks:
  atoz_net:
    external: true
